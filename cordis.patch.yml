# dsh-paper-analysis 的 bundle 补丁
#
# 【形态已实测】本文件形状在 DSH 0.1.2-rc.1 上验证过：
#   `dsh --profile web --patch <本文件> --dump-config`
# 的组合树里确实出现了被覆盖的 agent-presets 行（roots 生效）。
# 依据两处：`@deepseek-ai/dsh-agent-presets` 的 Config schema
#   { default, roots: [{path, trust: 'system'|'user'}], includeShippedRoot, includeUserRoot }
# 与第三方插件 `dsh-tavern-plugin` 的同一写法（它 patch 了 agent-presets）。
#
# 【两条通道的区别】
#   - patch（本文件）：目标 profile 里**已有** agent-presets 行时用（如 web，该行由
#     @deepseek-ai/dsh-web-app 提供）。写错成 insert 会因 id 重复冲突。
#   - insert（cordis.insert.patch.yml）：目标 profile **没有**该行时用（如 default）。
#
# 【必须改的一处】下面第二条 root 的绝对路径要换成你机器上本包的实际安装位置。
# 路径里不要有中文或空格；Windows 用正斜杠或转义反斜杠。
#
# 【注意的行为变化】补丁会替换整段 config，因此 `default` 一并被设置为 paper-analysis：
# 装完后新会话默认进入「论文分析模式」。要改回去：把 default 换成别的预设 id，
# 或在 settings 的 agent-preset 段里覆盖（settings 的 base 就是这里的 default）。

- id: agent-presets
  config:
    default: paper-analysis
    includeShippedRoot: true
    includeUserRoot: true
    roots:
      # ① 用户预设根：npx dsh-paper-analysis 会把预设装到这里，因此这条通常已够用
      - path: !!js dshHomePath('.agent-presets')
        trust: user
      # ② 本包目录（root 即预设目录）—— 改成你的实际安装路径，例如：
      #    Windows: C:/Users/<你>/AppData/Roaming/npm/node_modules/dsh-paper-analysis
      #    POSIX:   /usr/local/lib/node_modules/dsh-paper-analysis
      - path: REPLACE_WITH_ABSOLUTE_PATH_TO_THIS_PACKAGE
        trust: user
