# dsh-paper-analysis 的 bundle 补丁 —— insert 版本
#
# 用在**组合树里没有 agent-presets 行**的 profile 上（例：内置的 default profile，
# 实测其中没有该行，patch 会报 `entry "agent-presets" not found`）。
# 形态同样已实测：`dsh --profile default --patch <本文件> --dump-config` 后，
# 组合树里出现了本行与其 roots 配置。
#
# 已带 agent-presets 行的 profile（如 web）**不要**用这个文件：同 id 再 insert 会冲突。
# 那种情况请用同目录的 cordis.patch.yml。
#
# 同样要把 REPLACE_WITH_ABSOLUTE_PATH_TO_THIS_PACKAGE 换成实际安装路径。

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: paper-analysis
        includeShippedRoot: true
        includeUserRoot: true
        roots:
          - path: !!js dshHomePath('.agent-presets')
            trust: user
          - path: REPLACE_WITH_ABSOLUTE_PATH_TO_THIS_PACKAGE
            trust: user
